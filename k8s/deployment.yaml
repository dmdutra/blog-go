apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-dutra
  labels:
    app.kubernetes.io/name: blog-dutra
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-dutra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-dutra
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blog
          image: ghcr.io/dmdutra/blog-go:sha-080fdf2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
